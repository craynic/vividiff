[package]
name = "vividiff-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "vividiff-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
directories = "6"
fs2 = "0.4"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
